name: Release

# 推 v* 标签 → 构建四份产物并创建 GitHub Release。
# 手动触发 → 同样构建并上传为 Actions artifact，但不创建 Release（干跑验证）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04（glibc 2.35）比最新版更老，产物能在更多发行版上跑。
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # Apple Silicon runner 上交叉编译 Intel 版：两个 SDK 都在，产物是原生的。
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - id: build
        uses: ./.github/actions/build-atlas
        with:
          target: ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TRIPLE: ${{ matrix.target }}
          BINARY: ${{ steps.build.outputs.binary }}
        run: bash scripts/package-release.sh "$TRIPLE" "$BINARY"

      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum atlas-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
