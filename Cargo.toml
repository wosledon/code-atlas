[workspace]
resolver = "2"
members = [
    "crates/atlas-store",
    "crates/atlas-core",
    "crates/atlas-analyze",
    "crates/atlas-llm",
    "crates/atlas-claims",
    "crates/atlas-kb",
    "crates/atlas-server",
    "crates/atlas-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Code Atlas"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "time", "sync", "signal"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["json", "query"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
atlas-store = { path = "crates/atlas-store" }
atlas-core = { path = "crates/atlas-core" }
atlas-analyze = { path = "crates/atlas-analyze" }
atlas-llm = { path = "crates/atlas-llm" }
atlas-claims = { path = "crates/atlas-claims" }
atlas-kb = { path = "crates/atlas-kb" }
atlas-server = { path = "crates/atlas-server" }
indicatif = "0.17"
rust-embed = "8"
mime_guess = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
# 体积优先的第二档：不生成的展开表、且字符串池更紧凑。
# `catch_unwind` 全仓未使用，所以 abort 语义不会改变行为（panic 仍会终止进程）。
panic = "abort"

# 发布产物（CI 打的就是这个）：在 release 基础上再压一档体积。
# `opt-level = "z"` + `lto = "fat"` 对 CLI 这类以 IO/网络为主、算力不在热点的程序
# 几乎不掉性能，但能省下可观的机器码；真在意吞吐时可改用 release。
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true
