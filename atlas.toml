[llm]
provider = "openai-compatible"
model = "step-3.7-flash"
base_url = "https://api.stepfun.com/step_plan/v1"
temperature = 0.2
max_output_tokens = 16384
concurrency = 5
timeout_secs = 180
retries = 3

[privacy]
redact_paths = [
    "**/.env",
    "**/*.pem",
    "**/id_rsa*",
    "**/credentials*.json",
]
max_file_bytes = 262144

[graph]
llm_extract = true
max_neighborhood_depth = 3
authoritative_min_confidence = 0.7

[kb]
search = "fts5"
embed_model = ""
max_context_bytes = 24576

[kb.chunk]
mode = "hybrid"
target_tokens = 512
chunk_model = ""

[output]
strategy = "in-repo"
atlas_root = "atlas"
external_root = ""
language = "zh-CN"

[analyze]
languages = [
    "rust",
    "typescript",
    "javascript",
    "python",
]
